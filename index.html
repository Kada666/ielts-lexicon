<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><meta name="theme-color" content="#235b49"/><meta name="description" content="IELTS Lexicon · 属于你的雅思词汇，离线闪卡与个性化记忆。"/><link rel="icon" href="./icon.svg" type="image/svg+xml"/><link rel="manifest" href="./manifest.webmanifest"/><link rel="apple-touch-icon" href="./icon-192.png"/><title>IELTS Lexicon · 个人词汇学习系统</title>
<style>#lexicon-startup{max-width:30rem;margin:15vh auto 0;padding:1.5rem;text-align:center;color:#235b49;font:1rem/1.65 system-ui,sans-serif}#lexicon-startup a{display:inline-block;padding:.65rem 1rem;border:1px solid;border-radius:.5rem;text-decoration:none}</style>
</head><body>
<div id="root">
  <section id="lexicon-startup" aria-labelledby="lexicon-startup-title">
    <h1 id="lexicon-startup-title">IELTS Lexicon</h1>
    <p id="lexicon-startup-status" role="status">正在加载词库页面…</p>
    <a href="./">重新打开</a>
    <noscript>请在浏览器中启用 JavaScript，然后重新打开。</noscript>
  </section>
</div>
<script>
  (function () {
    function showRetry() {
      var status = document.getElementById('lexicon-startup-status');
      if (status) status.textContent = '页面还未加载。请检查网络，联网后点「重新打开」。';
    }
    window.addEventListener('error', function (event) {
      if (!event.target || event.target === window || event.target.tagName === 'SCRIPT') showRetry();
    }, true);
    setTimeout(showRetry, 10000);
  })();
</script>
<script type="module" src="/src/main.tsx"></script>
</body></html>
